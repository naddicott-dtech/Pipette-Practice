name: Deploy to GitHub Pages

# Deploy main's app-touching commits to GitHub Pages. Doc-only and
# CI-config-only commits don't redeploy (path filter below).
#
# Why main-only? GitHub Pages has one URL; per-PR preview deploys would
# need a separate host (Vercel / Netlify). The github-pages environment
# is also restricted to the default branch by default, so feature-branch
# pushes built the artifact then failed at the deploy step. Restricting
# the trigger to main aligns with that.
#
# Feature-branch CI still runs lint/test/build via the build job (which
# this workflow only schedules on main pushes). For per-branch CI gating,
# add a separate workflow that runs on `pull_request` events without the
# deploy job. We don't need that yet — chunk C reviews happen against the
# diff plus the merged-main deploy.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single deploy slot. Cancel in-progress runs so a newer push from
# any branch supersedes an older deploy mid-flight, instead of waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
