name: Deploy to GitHub Pages

# Deploy any branch's commits that actually touch the app. With no live
# users, fast iteration > release discipline — feature branches deploy
# their state to the single Pages slot, last push wins. Coordinate
# manually when multiple branches are active.
#
# Doc-only and CI-config-only commits don't deploy (path filter below).
on:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single deploy slot. Cancel in-progress runs so a newer push from
# any branch supersedes an older deploy mid-flight, instead of waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
